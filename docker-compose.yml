services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "5678:5678"
    command: >-
      python -m debugpy --listen 0.0.0.0:5678 --wait-for-client
      -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - PYTHONPATH=/app
      - TELEMETRY_DB_PATH=/data/telemetry.db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      - PYTHONPATH=/app
    env_file:
      - ./frontend/.env
    
  control_room:
    build: ./control_room
    ports:
      - "8601:8601"
    volumes:
      - ./control_room:/app
      - ./data:/data
    environment:
      - PYTHONPATH=/app
      - TELEMETRY_DB_PATH=/data/telemetry.db
